# TABS.CFG - keyprobe tabs.cfg
#
# The keys DESIGN 55 is about to be built on and 57 has never measured.
#
# The two Alt+numpad rows are the interesting ones. If the BIOS composes them
# itself the reply is the finished character with a scancode of zero, and the
# whole feature is widening momoed's insert range from 32..126 to 32..255. If
# they come back as Esc, or as the digits one at a time, it is a real feature.
#
# NumLock must be ON for these two, which is the opposite of the grey-key rows
# in the built-in list - hold Alt, type the digits on the keypad, release Alt.

Alt+0233 on the keypad
Alt+0165 on the keypad

# What Ctrl+Tab and its partner report decides whether tab cycling can be built
# at all. Tab and Shift+Tab are already in the record - 0F09 and 0F00 - and
# these two have never been pressed.

Ctrl+Tab
Ctrl+Shift+Tab

# Expected to be ordinary control characters, 20 and 23, and cheap to confirm
# while the machine is in front of you.

Ctrl+T
Ctrl+W
Ctrl+P

# The emoji key, if this keyboard has one. Reported as 3920 with flags 030E on
# one that does, which is Space carrying alt, ctrl and shift - so a key space
# that keeps only Shift cannot see it. Here to find out what the 286's keyboard
# does, not because anything is waiting on it.

The emoji key, or Esc if there is none
