# MENUS.CFG - keyprobe menus.cfg
#
# The keys a menu bar needs, and none of them are in the record yet.
#
# Alt+letter is the whole question. The BIOS has no character for it, so it
# should arrive as a scancode with AL=0 - and the scancodes are not the ones the
# unshifted letters report, which is why they have to be read rather than
# assumed. If any of these comes back with a character in AL instead, the menu
# cannot use that letter.
#
# Note what this is NOT: Alt+numpad, already measured, composes a character and
# reports a scancode of zero. These should be the opposite shape in both halves,
# and seeing that confirmed is half the value of asking.

Alt+F
Alt+E
Alt+S
Alt+V

# Alt+X is the DOS convention for Exit and costs nothing to ask while the others
# are being pressed.

Alt+X

# F10 is how edit.com and Turbo Pascal reach the menu bar with no letter at all,
# and is worth having whatever Alt+letter turns out to do - it is the key
# somebody who has used a DOS editor will try first.
#
# F1 is here because a menu bar usually comes with one, not because anything is
# waiting on it.

F10
F1

# The bar is left with Escape and walked with the arrows, all of which are in the
# record already. The one that is not is Alt on its own - some programs open the
# bar on the release of a bare Alt. If nothing happens here, that is the answer:
# int 16h reports keys, and Alt by itself is not one.

Alt on its own, then Esc if nothing happens
